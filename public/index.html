<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontend Match</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    .inputs, .images { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea { width: 100%; height: 240px; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 13px; padding: 8px; }
    button { margin: 16px 0; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #result { font-size: 40px; font-weight: 700; }
    #result.error { font-size: 16px; color: #b91c1c; }
    #details { color: #475569; margin-bottom: 16px; }
    [hidden] { display: none; }
    figure { margin: 0; }
    figure img { width: 100%; border: 1px solid #cbd5e1; background: white; }
    figcaption { font-weight: 600; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Frontend Match</h1>
  <div class="inputs">
    <div>
      <label for="target">Target HTML</label>
      <textarea id="target"><body style="margin:0;font-family:sans-serif">
  <header style="background:#1e293b;color:white;padding:20px">Acme</header>
  <main style="padding:40px"><h1>Welcome</h1><button style="background:#3b82f6;color:white;border:0;padding:12px 24px">Get started</button></main>
</body></textarea>
    </div>
    <div>
      <label for="attempt">Your HTML</label>
      <textarea id="attempt"><body style="margin:0;font-family:sans-serif">
  <header style="background:#334155;color:white;padding:16px">Acme</header>
  <main style="padding:40px"><h1>Welcome</h1><button style="background:#f97316;color:white;border:0;padding:12px 24px">Get started</button></main>
</body></textarea>
    </div>
  </div>
  <button id="score-btn">Score</button>
  <div id="result"></div>
  <div id="details"></div>
  <div class="images" id="images" hidden>
    <figure><figcaption>Target</figcaption><img id="img-target" alt="Target render"></figure>
    <figure><figcaption>Yours</figcaption><img id="img-attempt" alt="Your render"></figure>
    <figure><figcaption>Differences</figcaption><img id="img-diff" alt="Difference heatmap"></figure>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);

    $('score-btn').addEventListener('click', async () => {
      const button = $('score-btn');
      button.disabled = true;
      $('result').className = '';
      $('result').textContent = 'Scoring…';
      $('details').textContent = '';
      try {
        const res = await fetch('/api/score', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ targetHtml: $('target').value, attemptHtml: $('attempt').value }),
        });
        const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
        if (!res.ok) throw new Error(body.error);
        $('result').textContent = `${body.score} / 100`;
        const { ssim, colorSim } = body.details;
        $('details').textContent = `structure ${ssim.toFixed(3)} · colour ${colorSim.toFixed(3)}`;
        $('img-target').src = body.images.target;
        $('img-attempt').src = body.images.attempt;
        $('img-diff').src = body.images.diff;
        $('images').hidden = false;
      } catch (err) {
        $('result').className = 'error';
        $('result').textContent = err.message;
        $('images').hidden = true;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
