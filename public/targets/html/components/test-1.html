<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 48px; background: white; border-bottom: 1px solid #e2e8f0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .logo span { width: 32px; height: 32px; border-radius: 8px; background: #4f46e5; }
  .links { display: flex; gap: 32px; color: #475569; font-size: 15px; }
  .links a.active { color: #4f46e5; font-weight: 600; }
  .cta { background: #4f46e5; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  main { padding: 96px 48px; text-align: center; }
  h1 { font-size: 48px; margin: 0 0 16px; }
  p { color: #64748b; font-size: 18px; margin: 0; }
</style>
</head>
<body>
  <nav>
    <div class="logo"><span></span>Acme</div>
    <div class="links"><a class="active">Home</a><a>Features</a><a>Pricing</a><a>About</a></div>
    <div class="cta">Sign up</div>
  </nav>
  <main>
    <h1>Build faster with Acme</h1>
    <p>Everything your team needs, in one place.</p>
  </main>
</body>
</html>
