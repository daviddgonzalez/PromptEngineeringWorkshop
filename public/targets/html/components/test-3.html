<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #e2e8f0; min-height: 720px; display: flex; align-items: center; justify-content: center; }
  .card { width: 400px; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12); }
  h1 { margin: 0 0 4px; font-size: 26px; color: #0f172a; }
  .sub { margin: 0 0 28px; color: #64748b; }
  label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .input { height: 42px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 18px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; color: #475569; margin-bottom: 24px; }
  .row a { color: #0d9488; font-weight: 600; }
  .btn { background: #0d9488; color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; }
  .foot { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your account</p>
    <label>Email</label><div class="input"></div>
    <label>Password</label><div class="input"></div>
    <div class="row"><span>☐ Remember me</span><a>Forgot password?</a></div>
    <div class="btn">Sign in</div>
    <div class="foot">No account? <b>Create one</b></div>
  </div>
</body>
</html>
