<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: white; color: #111827; padding: 64px 96px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7280; margin: 0 0 16px; }
  .swatches { display: flex; margin-bottom: 56px; }
  .swatches div { flex: 1; height: 120px; }
  .buttons { display: flex; gap: 20px; align-items: center; margin-bottom: 56px; }
  .btn { padding: 12px 24px; font-weight: 600; font-size: 16px; border-radius: 10px; }
  .primary { background: #059669; color: white; }
  .secondary { background: #d1fae5; color: #065f46; }
  .outline { border: 2px solid #059669; color: #059669; }
  .ghost { color: #059669; text-decoration: underline; }
  .danger { background: #dc2626; color: white; border-radius: 9999px; }
  .disabled { background: #e5e7eb; color: #9ca3af; }
  .tags { display: flex; gap: 12px; }
  .tag { padding: 4px 12px; border-radius: 9999px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <h2>Palette</h2>
  <div class="swatches">
    <div style="background:#ecfdf5"></div><div style="background:#a7f3d0"></div><div style="background:#34d399"></div>
    <div style="background:#059669"></div><div style="background:#065f46"></div><div style="background:#022c22"></div>
  </div>
  <h2>Buttons</h2>
  <div class="buttons">
    <div class="btn primary">Primary</div><div class="btn secondary">Secondary</div><div class="btn outline">Outline</div>
    <div class="btn ghost">Ghost</div><div class="btn danger">Delete</div><div class="btn disabled">Disabled</div>
  </div>
  <h2>Tags</h2>
  <div class="tags">
    <span class="tag" style="background:#dbeafe;color:#1e40af">Info</span>
    <span class="tag" style="background:#dcfce7;color:#166534">Success</span>
    <span class="tag" style="background:#fef9c3;color:#854d0e">Warning</span>
    <span class="tag" style="background:#fee2e2;color:#991b1b">Error</span>
  </div>
</body>
</html>
