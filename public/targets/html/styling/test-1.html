<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: Georgia, serif; }
  .hero { height: 640px; background: linear-gradient(135deg, #7c3aed 0%, #db2777 55%, #f97316 100%); color: white; display: flex; flex-direction: column; justify-content: center; padding: 0 112px; }
  .eyebrow { font-family: system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 14px; opacity: 0.85; }
  h1 { font-size: 88px; line-height: 1; margin: 20px 0; font-style: italic; }
  p { font-family: system-ui, sans-serif; font-size: 20px; max-width: 560px; line-height: 1.6; opacity: 0.9; margin: 0; }
</style>
</head>
<body>
  <section class="hero">
    <div class="eyebrow">Autumn collection</div>
    <h1>Colour that<br>moves you.</h1>
    <p>Bold gradients, generous type and plenty of breathing room.</p>
  </section>
</body>
</html>
